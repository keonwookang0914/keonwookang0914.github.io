name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build (production)
        run: |
          bundle exec jekyll build
          # gh-pages는 이미 빌드된 결과물이다. .nojekyll이 없으면 Pages가 이 브랜치를
          # 한 번 더 Jekyll로 처리하면서 밑줄로 시작하는 파일 등을 조용히 빼먹을 수 있다.
          touch _site/.nojekyll
        env:
          JEKYLL_ENV: production

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
